<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>审核 - 智阅同行管理后台</title>
    <link rel="stylesheet" href="https://cdn.bootcdn.net/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/admin.css">
</head>

<body>
    <div class="container">
        <nav class="top-nav">
            <div class="logo">
                <i class="fas fa-book-open"></i>
                <span>智阅同行 · 管理后台</span>
            </div>
            <div class="nav-right">
                <div class="user-profile" id="user-profile">
                    <div class="user-avatar" id="admin-avatar">AD</div>
                    <span id="admin-name">管理员</span>
                    <i class="fas fa-chevron-down"></i>
                    <div class="user-dropdown" id="user-dropdown">
                        <div class="user-info">
                            <div class="name" id="dropdown-name">管理员</div>
                            <div class="phone" id="dropdown-phone"></div>
                            <div class="admin-badge"><i class="fas fa-shield-alt"></i> 管理员</div>
                        </div>
<a href="index.html" class="dropdown-item">
                             <i class="fas fa-home"></i>
                             <span>返回用户端</span>
                         </a>
                         <a href="#" class="dropdown-item" onclick="logout()">
                            <i class="fas fa-sign-out-alt"></i>
                            <span>退出登录</span>
                        </a>
                    </div>
                </div>
            </div>
        </nav>

        <aside class="sidebar" id="sidebar">
            <div class="sidebar-header">
                <div class="sidebar-toggle" id="sidebar-toggle">
                    <i class="fas fa-bars"></i>
                </div>
            </div>
            <ul class="sidebar-menu">
                <li class="menu-item">
                    <a href="admin.html" class="menu-link">
                        <i class="fas fa-tachometer-alt"></i>
                        <span class="menu-text">仪表盘</span>
                    </a>
                </li>
                <li class="menu-item">
                    <a href="admin-requests.html" class="menu-link active">
                        <i class="fas fa-clipboard-list"></i>
                        <span class="menu-text">审核</span>
                        <span class="badge badge-warning" id="sidebar-pending-count">0</span>
                    </a>
                </li>
                <li class="menu-item">
                    <a href="admin-books.html" class="menu-link">
                        <i class="fas fa-book"></i>
                        <span class="menu-text">图书管理</span>
                    </a>
                </li>
                <li class="menu-item">
                    <a href="admin-users.html" class="menu-link">
                        <i class="fas fa-users"></i>
                        <span class="menu-text">用户管理</span>
                    </a>
                </li>
                <li class="menu-item">
                    <a href="admin-activities.html" class="menu-link">
                        <i class="fas fa-calendar-alt"></i>
                        <span class="menu-text">活动管理</span>
                    </a>
                </li>
                <li class="menu-item">
                    <a href="admin-notifications.html" class="menu-link">
                        <i class="fas fa-bell"></i>
                        <span class="menu-text">通知管理</span>
                    </a>
                </li>
                <li class="menu-item">
                    <a href="admin-stats.html" class="menu-link">
                        <i class="fas fa-chart-bar"></i>
                        <span class="menu-text">数据统计</span>
                    </a>
                </li>
            </ul>
        </aside>

        <main class="main-content admin-main">
            <div class="page-header">
                <h1>审核</h1>
                <p>处理用户的借阅申请、还书申请、续借申请、挂失申请和读后感审核</p>
            </div>

            <div class="filter-bar">
                <div class="filter-group">
                    <label>申请类型</label>
                    <select id="filter-type" onchange="loadRequests(1)">
                        <option value="">全部类型</option>
                        <option value="borrow">借书申请</option>
                        <option value="return">还书申请</option>
                        <option value="renew">续借申请</option>
                        <option value="lost">挂失申请</option>
                        <option value="review">读后感审核</option>
                        <option value="password_reset">密码重置申请</option>
                    </select>
                </div>
                <div class="filter-group">
                    <label>审核状态</label>
                    <select id="filter-status" onchange="loadRequests(1)">
                        <option value="pending">待审核</option>
                        <option value="approved">已通过</option>
                        <option value="rejected">已拒绝</option>
                        <option value="">全部状态</option>
                    </select>
                </div>
                <div class="filter-group">
                    <label>时间范围</label>
                    <div class="date-shortcuts">
                        <button class="date-shortcut active" onclick="setDateShortcut('today')">今天</button>
                        <button class="date-shortcut" onclick="setDateShortcut('7days')">近7天</button>
                        <button class="date-shortcut" onclick="setDateShortcut('30days')">近30天</button>
                        <button class="date-shortcut" onclick="setDateShortcut('month')">本月</button>
                        <button class="date-shortcut" onclick="setDateShortcut('custom')">自定义</button>
                    </div>
                    <div class="date-range-group" id="date-range-group" style="display: none;">
                        <input type="date" id="start-date" onchange="loadRequests(1)">
                        <span>至</span>
                        <input type="date" id="end-date" onchange="loadRequests(1)">
                    </div>
                </div>
                <button class="btn-reset" onclick="resetFilters()">
                    <i class="fas fa-redo"></i> 重置
                </button>
                <button class="btn-export-small" onclick="exportRequests()">
                    <i class="fas fa-download"></i> 导出CSV
                </button>
            </div>

            <div class="batch-action-bar" id="batch-action-bar" style="display: none;">
                <label class="select-all">
                    <input type="checkbox" id="select-all" onchange="toggleSelectAll(this.checked)">
                    <span>全选当前页</span>
                </label>
                <span class="selected-count">已选择 <strong id="selected-count">0</strong> 项<span id="total-info"></span></span>
                <button class="btn-select-all-filtered" id="select-all-btn" onclick="selectAllFiltered()">选择全部</button>
                <button class="btn-batch btn-batch-approve" onclick="batchApprove()">
                    <i class="fas fa-check"></i> 批量批准
                </button>
                <button class="btn-batch btn-batch-reject" onclick="showBatchRejectModal()">
                    <i class="fas fa-times"></i> 批量拒绝
                </button>
            </div>

            <div class="requests-table-container">
                <table class="requests-table">
<thead>
                            <tr id="table-header">
                                <th class="col-checkbox">
                                    <input type="checkbox" id="select-all-header" onchange="toggleSelectAll(this.checked)">
                                </th>
                                <th class="col-type">类型</th>
                                <th class="col-user">申请人</th>
                                <th class="col-book">书籍信息</th>
                                <th class="col-extra">附加信息</th>
                                <th class="col-time">时间</th>
                                <th class="col-status">状态</th>
                                <th class="col-actions">操作</th>
                            </tr>
                        </thead>
                    <tbody id="requests-list">
                        <tr>
                            <td colspan="7" class="loading-cell">
                                <i class="fas fa-spinner fa-spin"></i> 加载中...
                            </td>
                        </tr>
                    </tbody>
                </table>
            </div>

            <div class="pagination" id="pagination">
            </div>
        </main>
    </div>

    <div class="modal-overlay" id="modal-detail">
        <div class="modal-box modal-lg">
            <div class="modal-header">
                <h3><i class="fas fa-info-circle"></i> 申请详情</h3>
                <span class="close-modal" onclick="closeModal('modal-detail')">&times;</span>
            </div>
            <div class="modal-body" id="modal-detail-content">
            </div>
            <div class="modal-footer" id="modal-detail-footer">
            </div>
        </div>
    </div>

    <div class="modal-overlay" id="modal-reject">
        <div class="modal-box">
            <div class="modal-header warning-header">
                <h3><i class="fas fa-exclamation-triangle"></i> 拒绝申请</h3>
                <span class="close-modal" onclick="closeModal('modal-reject')">&times;</span>
            </div>
            <div class="modal-body">
                <p>请填写拒绝原因：</p>
                <textarea id="reject-reason" rows="4" placeholder="请输入拒绝原因..."></textarea>
            </div>
            <div class="modal-footer">
                <button class="btn-cancel" onclick="closeModal('modal-reject')">取消</button>
                <button class="btn-danger" onclick="confirmReject()">
                    <i class="fas fa-times"></i> 确认拒绝
                </button>
            </div>
        </div>
    </div>

    <div class="modal-overlay" id="modal-batch-reject">
        <div class="modal-box">
            <div class="modal-header warning-header">
                <h3><i class="fas fa-exclamation-triangle"></i> 批量拒绝</h3>
                <span class="close-modal" onclick="closeModal('modal-batch-reject')">&times;</span>
            </div>
            <div class="modal-body">
                <p class="warning-text">已选择 <strong id="batch-reject-count">0</strong> 项申请</p>
                <p>请填写拒绝原因：</p>
                <textarea id="batch-reject-reason" rows="4" placeholder="请输入拒绝原因..."></textarea>
            </div>
            <div class="modal-footer">
                <button class="btn-cancel" onclick="closeModal('modal-batch-reject')">取消</button>
                <button class="btn-danger" onclick="confirmBatchReject()">
                    <i class="fas fa-times"></i> 确认拒绝
                </button>
            </div>
        </div>
    </div>

    <script src="js/main.js"></script>
    <script src="js/admin-requests.js"></script>
</body>

</html>
