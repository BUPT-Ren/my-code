<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>智阅同行 - 图书馆资源共享平台</title>
    <link rel="stylesheet" href="https://cdn.bootcdn.net/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/book-cards.css">
    <link rel="stylesheet" href="css/home.css">
    <link rel="stylesheet" href="css/home-books.css">
</head>

<body>
    <div class="container">
        <nav class="top-nav">
            <div class="logo">
                <i class="fas fa-book-open"></i>
                <span>智阅同行</span>
            </div>
            <div class="nav-right">
                <a href="notifications.html" class="nav-icon">
                    <i class="fas fa-bell"></i>
                </a>
                <a href="settings.html" class="nav-icon">
                    <i class="fas fa-cog"></i>
                </a>
                <div class="user-profile" id="user-profile">
                    <div class="user-avatar" id="nav-user-avatar">U</div>
                    <span id="nav-user-name">用户</span>
                    <i class="fas fa-chevron-down"></i>
                    <div class="user-dropdown" id="user-dropdown">
                        <div class="user-info">
                            <div class="name" id="dropdown-user-name">用户</div>
                            <div class="phone" id="dropdown-user-phone"></div>
                        </div>
                        <a href="profile.html" class="dropdown-item">
                            <i class="fas fa-user"></i>
                            <span>个人资料</span>
                        </a>
                        <a href="favorites.html" class="dropdown-item">
                            <i class="fas fa-heart"></i>
                            <span>我的收藏</span>
                        </a>
                        <a href="history.html" class="dropdown-item">
                            <i class="fas fa-history"></i>
                            <span>借阅历史</span>
                        </a>
                        <a href="settings.html" class="dropdown-item">
                            <i class="fas fa-cog"></i>
                            <span>偏好设置</span>
                        </a>
                        <a href="admin.html" class="dropdown-item" id="admin-entry" style="display: none;">
                            <i class="fas fa-shield-alt"></i>
                            <span>管理后台</span>
                        </a>
                        <a href="#" class="dropdown-item" onclick="logout()">
                            <i class="fas fa-sign-out-alt"></i>
                            <span>退出登录</span>
                        </a>
                    </div>
                </div>
            </div>
        </nav>

        <aside class="sidebar" id="sidebar">
            <div class="sidebar-header">
                <div class="sidebar-toggle" id="sidebar-toggle">
                    <i class="fas fa-bars"></i>
                </div>
            </div>
            <ul class="sidebar-menu">
                <li class="menu-item">
                    <a href="index.html" class="menu-link active">
                        <i class="fas fa-home"></i>
                        <span class="menu-text">首页</span>
                    </a>
                </li>
                <li class="menu-item">
                    <a href="favorites.html" class="menu-link">
                        <i class="fas fa-bookmark"></i>
                        <span class="menu-text">收藏的书籍</span>
                        <span class="badge" data-type="favorites">0</span>
                    </a>
                </li>
                <li class="menu-item">
                    <a href="history.html" class="menu-link">
                        <i class="fas fa-history"></i>
                        <span class="menu-text">借阅历史</span>
                    </a>
                </li>
                <li class="menu-item">
                    <a href="borrowed.html" class="menu-link">
                        <i class="fas fa-book"></i>
                        <span class="menu-text">借阅及申请</span>
                        <span class="badge" data-type="borrowed">0</span>
                    </a>
                </li>
                <li class="menu-item">
                    <a href="activities.html" class="menu-link">
                        <i class="fas fa-calendar-alt"></i>
                        <span class="menu-text">活动</span>
                    </a>
                </li>
                <li class="menu-item">
                    <a href="recommend.html" class="menu-link">
                        <i class="fas fa-robot"></i>
                        <span class="menu-text">AI推荐</span>
                    </a>
                </li>
                <li class="menu-item">
                    <a href="stats.html" class="menu-link">
                        <i class="fas fa-chart-bar"></i>
                        <span class="menu-text">阅读统计</span>
                    </a>
                </li>
            </ul>
        </aside>

        <main class="main-content">

            <section class="search-section">
                <div class="search-box">
                    <input type="text" id="all-books-search" class="search-input" placeholder="搜索书名、作者或ISBN...">
                    <button id="all-books-search-btn" class="search-btn" type="button">
                        <i class="fas fa-search"></i>
                    </button>
                </div>
                <div class="filter-row">
                    <div class="filter-group">
                        <label class="filter-label">书籍类型</label>
                        <select class="filter-select" id="genre-select">
                            <option value="">全部类型</option>
                        </select>
                    </div>
                    <div class="filter-group">
                        <label class="filter-label">可借状态</label>
                        <select class="filter-select" id="status-select">
                            <option value="">全部状态</option>
                            <option value="available">可借阅</option>
                            <option value="borrowed">已借出</option>
                            <option value="reading">馆内阅读</option>
                        </select>
                    </div>
                    <div class="filter-group">
                        <label class="filter-label">出版时间</label>
                        <select class="filter-select" id="publish-time-select">
                            <option value="">全部时间</option>
                            <option value="1">近一年</option>
                            <option value="3">近三年</option>
                            <option value="5">近五年</option>
                            <option value="5+">五年以上</option>
                        </select>
                    </div>
                </div>
            </section>

            <section class="books-section" id="popular-section">
                <div class="section-header">
                    <h2 class="section-title">热门借阅</h2>
                </div>
                <div class="books-grid" id="home-popular-books">
                </div>
            </section>

            <section class="books-section" id="all-books-section">
                <div class="section-header">
                    <h2 class="section-title">全部馆藏</h2>
                </div>
                <div class="books-grid" id="all-books-container">
                </div>

                <div style="text-align: center; margin-top: 2rem;">
                    <button id="load-more-books" class="action-btn btn-borrow"
                        style="padding: 0.8rem 2rem; font-size: 1rem;">
                        加载更多
                    </button>
                </div>
            </section>

            <section class="books-section" id="search-results-section" style="display: none;">
                <div class="section-header">
                    <h2 class="section-title" id="search-results-title">搜索结果</h2>
                    <button id="clear-search-btn" class="action-btn" style="padding: 0.5rem 1rem; font-size: 0.9rem; background: var(--bg-secondary); border: 1px solid var(--border-color);">
                        <i class="fas fa-times"></i> 清除搜索
                    </button>
                </div>
                <div class="books-grid" id="search-results-container">
                </div>

                <div style="text-align: center; margin-top: 2rem;">
                    <button id="load-more-search" class="action-btn btn-borrow"
                        style="padding: 0.8rem 2rem; font-size: 1rem;">
                        加载更多
                    </button>
                </div>
            </section>

        </main>
    </div>

    <script src="js/main.js"></script>
</body>

</html>
