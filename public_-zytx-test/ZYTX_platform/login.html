<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>登录 - 智阅同行</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/auth.css">
    <link rel="stylesheet" href="https://cdn.bootcdn.net/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>

<body>
    <!-- 顶部导航栏 -->
    <nav class="top-nav">
        <div class="logo">
            <i class="fas fa-book"></i> 智阅同行
        </div>
        <div class="nav-right">
            <a href="index.html" class="nav-icon"><i class="fas fa-home"></i></a>
        </div>
    </nav>

    <!-- 登录表单 -->
    <main class="auth-container">
        <div class="auth-card">
            <h2>欢迎回来</h2>
            <p class="subtitle">使用邮箱或手机号登录</p>

            <form id="login-form">
                <div class="input-group">
                    <label for="login-identifier">邮箱/手机号</label>
                    <input type="text" id="login-identifier" placeholder="请输入邮箱或手机号" required>
                </div>

                <div class="input-group">
                    <label for="login-password">密码</label>
                    <input type="password" id="login-password" placeholder="请输入密码" required>
                </div>

                <div class="options">
                    <a href="javascript:void(0)" onclick="showForgotPasswordModal()">忘记密码？</a>
                </div>

                <button type="submit" class="btn-primary">登录</button>

                <p class="switch-link">还没有账号？ <a href="register.html">立即注册</a></p>
            </form>
        </div>
    </main>

    <!-- 忘记密码弹窗 -->
    <div class="modal-overlay" id="modal-forgot-password">
        <div class="modal-box">
            <div class="modal-header">
                <h3><i class="fas fa-key"></i> 找回密码</h3>
                <span class="close-modal" onclick="closeModal('modal-forgot-password')">&times;</span>
            </div>
            <div class="modal-body">
                <p class="modal-hint">请输入您的手机号，管理员将处理您的密码重置申请。</p>
                <div class="input-group">
                    <label for="forgot-phone">手机号 <span class="required">*</span></label>
                    <input type="text" id="forgot-phone" placeholder="请输入注册手机号">
                </div>
                <div class="input-group">
                    <label for="forgot-reason">申请原因（可选）</label>
                    <textarea id="forgot-reason" placeholder="如有需要请填写申请原因" rows="3"></textarea>
                </div>
            </div>
            <div class="modal-footer">
                <button class="btn-cancel" onclick="closeModal('modal-forgot-password')">取消</button>
                <button class="btn-primary" onclick="submitForgotPassword()">
                    <i class="fas fa-paper-plane"></i> 提交申请
                </button>
            </div>
        </div>
    </div>

    <script src="js/auth.js"></script>
</body>

</html>
