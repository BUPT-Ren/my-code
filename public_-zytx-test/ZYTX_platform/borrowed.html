<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>正在借阅 - 智阅同行</title>
    <link rel="stylesheet" href="https://cdn.bootcdn.net/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/borrowed.css">
</head>

<body>
    <div class="container">
        <nav class="top-nav">
            <div class="logo">
                <i class="fas fa-book-open"></i>
                <span>智阅同行</span>
            </div>
            <div class="nav-right">
                <a href="notifications.html" class="nav-icon"><i class="fas fa-bell"></i></a>
                <a href="settings.html" class="nav-icon"><i class="fas fa-cog"></i></a>
                <div class="user-profile" id="user-profile">
                    <div class="user-avatar" id="nav-user-avatar">U</div>
                    <span id="nav-user-name">用户</span>
                    <i class="fas fa-chevron-down"></i>
                    <div class="user-dropdown" id="user-dropdown">
                        <div class="user-info">
                            <div class="name" id="dropdown-user-name">用户</div>
                            <div class="phone" id="dropdown-user-phone"></div>
                        </div>
                        <a href="profile.html" class="dropdown-item"><i class="fas fa-user"></i><span>个人资料</span></a>
                        <a href="favorites.html" class="dropdown-item"><i class="fas fa-heart"></i><span>我的收藏</span></a>
                        <a href="history.html" class="dropdown-item"><i class="fas fa-history"></i><span>借阅历史</span></a>
                        <a href="settings.html" class="dropdown-item"><i class="fas fa-cog"></i><span>偏好设置</span></a>
                        <a href="admin.html" class="dropdown-item" id="admin-entry" style="display: none;"><i class="fas fa-shield-alt"></i><span>管理后台</span></a>
                        <a href="#" class="dropdown-item" onclick="logout()"><i class="fas fa-sign-out-alt"></i><span>退出登录</span></a>
                    </div>
                </div>
            </div>
        </nav>

        <aside class="sidebar" id="sidebar">
            <div class="sidebar-header">
                <div class="sidebar-toggle" id="sidebar-toggle"><i class="fas fa-bars"></i></div>
            </div>
            <ul class="sidebar-menu">
                <li class="menu-item"><a href="index.html" class="menu-link"><i class="fas fa-home"></i><span
                            class="menu-text">首页</span></a></li>
                <li class="menu-item"><a href="favorites.html" class="menu-link"><i class="fas fa-bookmark"></i><span
                            class="menu-text">收藏的书籍</span><span class="badge" data-type="favorites">0</span></a></li>
                <li class="menu-item"><a href="history.html" class="menu-link"><i class="fas fa-history"></i><span
                            class="menu-text">借阅历史</span></a></li>
                <li class="menu-item"><a href="borrowed.html" class="menu-link active"><i class="fas fa-book"></i><span
                            class="menu-text">借阅及申请</span><span class="badge" data-type="borrowed">0</span></a></li>
                <li class="menu-item"><a href="activities.html" class="menu-link"><i class="fas fa-calendar-alt"></i><span
                            class="menu-text">活动</span></a></li>
                <li class="menu-item"><a href="recommend.html" class="menu-link"><i class="fas fa-robot"></i><span
                            class="menu-text">AI推荐</span></a></li>
                <li class="menu-item"><a href="stats.html" class="menu-link"><i class="fas fa-chart-bar"></i><span
                            class="menu-text">阅读统计</span></a></li>
            </ul>
        </aside>

        <main class="main-content">
            <section class="borrowed-section">
                <div class="page-header-tabs">
                    <button class="tab-btn active" data-tab="borrowing">
                        <i class="fas fa-book"></i> 正在借阅
                    </button>
                    <button class="tab-btn" data-tab="requests">
                        <i class="fas fa-clock"></i> 待审核申请
                        <span class="tab-badge" id="request-count">0</span>
                    </button>
                </div>

                <div id="borrowed-list" class="borrowed-list-container tab-content active">
                    <div class="loading-placeholder">加载中...</div>
                </div>

                <div id="requests-list" class="requests-list-container tab-content">
                    <div class="loading-placeholder">加载中...</div>
                </div>
            </section>
        </main>
    </div>

    <div id="modal-return" class="modal-overlay">
        <div class="modal-box">
            <div class="modal-header">
                <h3><i class="fas fa-undo"></i> 归还申请</h3>
                <span class="close-modal">&times;</span>
            </div>
            <div class="modal-body">
                <p>归还书籍需要管理员审核，请确认以下信息。</p>
                <div class="return-instruction">
                    <p><strong>归还流程：</strong></p>
                    <p>1. 点击下方按钮提交还书申请。</p>
                    <p>2. 等待管理员审核通过。</p>
                    <p>3. 收到通知后，请在指定时间前往图书馆归还书籍。</p>
                </div>
            </div>
            <div class="modal-footer">
                <button class="btn-cancel close-modal-btn">取消</button>
                <button id="confirm-return-btn" class="btn-confirm">提交还书申请</button>
            </div>
        </div>
    </div>

    <div id="modal-extend" class="modal-overlay">
        <div class="modal-box email-style">
            <div class="modal-header">
                <h3><i class="fas fa-clock"></i> 申请延期</h3>
                <span class="close-modal">&times;</span>
            </div>
            <div class="modal-body">
                <p style="color: #666; margin-bottom: 1rem;">续借申请需要管理员审核，审核通过后生效。</p>
                <div class="form-group">
                    <label>延期时长：</label>
                    <select id="extend-duration">
                        <option value="7">7天</option>
                        <option value="15">15天</option>
                        <option value="30">30天</option>
                    </select>
                </div>
                <div class="form-group">
                    <label>申请原因：<span style="color: #E53E3E;">*</span></label>
                    <textarea id="extend-reason" rows="4" placeholder="请详细说明需要延期的原因..." required></textarea>
                </div>
            </div>
            <div class="modal-footer">
                <button class="btn-cancel close-modal-btn">取消</button>
                <button id="send-extend-btn" class="btn-confirm"><i class="fas fa-paper-plane"></i> 提交申请</button>
            </div>
        </div>
    </div>

    <div id="modal-lost" class="modal-overlay">
        <div class="modal-box">
            <div class="modal-header warning-header">
                <h3><i class="fas fa-exclamation-triangle"></i> 挂失申请</h3>
                <span class="close-modal">&times;</span>
            </div>
            <div class="modal-body">
                <p class="warning-text">挂失申请需要管理员审核。书籍遗失或损坏可能需要照价赔偿。</p>
                <div class="form-group">
                    <label>具体情况说明：<span style="color: #E53E3E;">*</span></label>
                    <textarea id="lost-reason" rows="4" placeholder="请描述书籍遗失或无法归还的具体原因..." required></textarea>
                </div>
            </div>
            <div class="modal-footer">
                <button class="btn-cancel close-modal-btn">取消</button>
                <button id="confirm-lost-btn" class="btn-danger">提交申请</button>
            </div>
        </div>
    </div>

    <script src="js/main.js"></script>
    <script src="js/borrowed.js"></script>
</body>

</html>
