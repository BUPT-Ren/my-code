<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>偏好设置 - 智阅同行</title>
    <link rel="stylesheet" href="https://cdn.bootcdn.net/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/settings.css">
</head>

<body>
    <div class="container">
        <!-- 顶部导航栏 -->
        <nav class="top-nav">
            <div class="logo">
                <i class="fas fa-book-open"></i>
                <span>智阅同行</span>
            </div>
            <div class="nav-right">
                <a href="notifications.html" class="nav-icon"><i class="fas fa-bell"></i></a>
                <a href="settings.html" class="nav-icon"><i class="fas fa-cog"></i></a>
                <div class="user-profile" id="user-profile">
                    <div class="user-avatar" id="nav-user-avatar">U</div>
                    <span id="nav-user-name">用户</span>
                    <i class="fas fa-chevron-down"></i>
                    <div class="user-dropdown" id="user-dropdown">
                        <div class="user-info">
                            <div class="name" id="dropdown-user-name">用户</div>
                            <div class="phone" id="dropdown-user-phone"></div>
                        </div>
                        <a href="profile.html" class="dropdown-item"><i class="fas fa-user"></i><span>个人资料</span></a>
                        <a href="favorites.html" class="dropdown-item"><i class="fas fa-heart"></i><span>我的收藏</span></a>
                        <a href="history.html" class="dropdown-item"><i class="fas fa-history"></i><span>借阅历史</span></a>
                        <a href="settings.html" class="dropdown-item"><i class="fas fa-cog"></i><span>偏好设置</span></a>
                        <a href="admin.html" class="dropdown-item" id="admin-entry" style="display: none;"><i class="fas fa-shield-alt"></i><span>管理后台</span></a>
                        <a href="#" class="dropdown-item" onclick="logout()"><i class="fas fa-sign-out-alt"></i><span>退出登录</span></a>
                    </div>
                </div>
            </div>
        </nav>

        <!-- 侧边栏 -->
        <aside class="sidebar" id="sidebar">
            <div class="sidebar-header">
                <div class="sidebar-toggle" id="sidebar-toggle"><i class="fas fa-bars"></i></div>
            </div>
            <ul class="sidebar-menu">
                <li class="menu-item"><a href="index.html" class="menu-link"><i class="fas fa-home"></i><span
                            class="menu-text">首页</span></a></li>
                <li class="menu-item"><a href="favorites.html" class="menu-link"><i class="fas fa-bookmark"></i><span
                            class="menu-text">收藏的书籍</span></a></li>
                <li class="menu-item"><a href="history.html" class="menu-link"><i class="fas fa-history"></i><span
                            class="menu-text">借阅历史</span></a></li>
                <li class="menu-item"><a href="borrowed.html" class="menu-link"><i class="fas fa-book"></i><span
                            class="menu-text">借阅及申请</span></a></li>
                <li class="menu-item"><a href="activities.html" class="menu-link"><i class="fas fa-calendar-alt"></i><span
                            class="menu-text">活动</span></a></li>
                <li class="menu-item"><a href="recommend.html" class="menu-link"><i class="fas fa-robot"></i><span
                            class="menu-text">AI推荐</span></a></li>
                <li class="menu-item"><a href="stats.html" class="menu-link"><i class="fas fa-chart-bar"></i><span
                            class="menu-text">阅读统计</span></a></li>
                <li class="menu-item"><a href="settings.html" class="menu-link active"><i class="fas fa-cog"></i><span
                            class="menu-text">偏好设置</span></a></li>
            </ul>
        </aside>

        <!-- 主内容区域 -->
        <main class="main-content">
            <section class="settings-section">
                <h2 class="section-title">个人信息设置</h2>

                <div class="settings-card">
                    <form id="settings-form">
                        <h3 style="margin-bottom: 1rem; color: #333;">基本信息</h3>
                        <div class="input-group">
                            <label for="settings-phone">手机号</label>
                            <input type="text" id="settings-phone" placeholder="请输入手机号" maxlength="11">
                        </div>
                        <div class="input-group">
                            <label for="settings-birthday">生日</label>
                            <input type="date" id="settings-birthday">
                        </div>
                        <div class="input-group">
                            <label for="settings-school">学校</label>
                            <input type="text" id="settings-school" placeholder="请输入学校">
                        </div>
                        <div class="input-group">
                            <label for="settings-hobbies">阅读偏好</label>
                            <input type="text" id="settings-hobbies" placeholder="如：科幻、历史、文学">
                        </div>

                        <h3 style="margin: 1.5rem 0 1rem; color: #333;">修改密码</h3>
                        <div class="input-group">
                            <label for="settings-old-password">旧密码</label>
                            <input type="password" id="settings-old-password" placeholder="请输入旧密码">
                        </div>
                        <div class="input-group">
                            <label for="settings-new-password">新密码</label>
                            <input type="password" id="settings-new-password" placeholder="请输入新密码">
                        </div>
                        <div class="input-group">
                            <label for="settings-confirm-password">确认新密码</label>
                            <input type="password" id="settings-confirm-password" placeholder="请再次输入新密码">
                        </div>

                        <button type="submit" class="btn-primary">保存修改</button>
                    </form>
                </div>
            </section>
        </main>
    </div>

    <script src="js/main.js"></script>
    <script src="js/settings.js"></script>
</body>

</html>
