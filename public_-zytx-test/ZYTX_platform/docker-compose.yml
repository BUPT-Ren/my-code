services:
  mysql:
    image: mysql:8.0
    container_name: zytx_mysql
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-zytx_root_password_2024}
      MYSQL_DATABASE: zytx
      MYSQL_USER: ${DB_USER:-zytx_user}
      MYSQL_PASSWORD: ${DB_PASSWORD:-zytx_password_2024}
      TZ: Asia/Shanghai
    volumes:
      - mysql_data:/var/lib/mysql
      - ./zytx.sql:/docker-entrypoint-initdb.d/init.sql:ro
    ports:
      - "127.0.0.1:3306:3306"
    networks:
      - zytx_network
    command: --character-set-server=utf8mb4
      --collation-server=utf8mb4_unicode_ci
      --default-authentication-plugin=mysql_native_password
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5

  flask:
    build: .
    container_name: zytx_flask
    restart: always
    environment:
      - DB_HOST=mysql
      - DB_PORT=3306
      - DB_USER=${DB_USER:-zytx_user}
      - DB_PASSWORD=${DB_PASSWORD:-zytx_password_2024}
      - DB_NAME=zytx
      - DB_DRIVER=pymysql
      - SECRET_KEY=${SECRET_KEY:-production-secret-key-change-me}
      - DEEPSEEK_API_KEY=${DEEPSEEK_API_KEY:-}
      - DEEPSEEK_MODEL=${DEEPSEEK_MODEL:-deepseek-chat}
      - ADMIN_REGISTER_KEY=${ADMIN_REGISTER_KEY:-ZYTX_ADMIN_2024}
      - DEBUG=False
      - TZ=Asia/Shanghai
    volumes:
      - ./static/uploads:/app/static/uploads
    depends_on:
      mysql:
        condition: service_healthy
    networks:
      - zytx_network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

  nginx:
    image: nginx:alpine
    container_name: zytx_nginx
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./:/app:ro
      - ./nginx/ssl:/etc/nginx/ssl:ro
    depends_on:
      - flask
    networks:
      - zytx_network
    healthcheck:
      test: ["CMD", "nginx", "-t"]
      interval: 30s
      timeout: 10s
      retries: 3

volumes:
  mysql_data:
    driver: local

networks:
  zytx_network:
    driver: bridge
