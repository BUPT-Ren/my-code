<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>阅读统计 - 智阅同行</title>
    <link rel="stylesheet" href="https://cdn.bootcdn.net/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/stats.css">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>

<body>
    <div class="container">
        <!-- 顶部导航栏 -->
        <nav class="top-nav">
            <div class="logo">
                <i class="fas fa-book-open"></i>
                <span>智阅同行</span>
            </div>
            <div class="nav-right">
                <a href="notifications.html" class="nav-icon">
                    <i class="fas fa-bell"></i>
                </a>
                <a href="settings.html" class="nav-icon">
                    <i class="fas fa-cog"></i>
                </a>
                <div class="user-profile" id="user-profile">
                    <div class="user-avatar" id="nav-user-avatar">U</div>
                    <span id="nav-user-name">用户</span>
                    <i class="fas fa-chevron-down"></i>
                    <div class="user-dropdown" id="user-dropdown">
                        <div class="user-info">
                            <div class="name" id="dropdown-user-name">用户</div>
                            <div class="phone" id="dropdown-user-phone"></div>
                        </div>
                        <a href="profile.html" class="dropdown-item"><i class="fas fa-user"></i><span>个人资料</span></a>
                        <a href="favorites.html" class="dropdown-item"><i class="fas fa-heart"></i><span>我的收藏</span></a>
                        <a href="history.html" class="dropdown-item"><i class="fas fa-history"></i><span>借阅历史</span></a>
                        <a href="settings.html" class="dropdown-item"><i class="fas fa-cog"></i><span>偏好设置</span></a>
                        <a href="admin.html" class="dropdown-item" id="admin-entry" style="display: none;"><i class="fas fa-shield-alt"></i><span>管理后台</span></a>
                        <a href="#" class="dropdown-item" onclick="logout()"><i class="fas fa-sign-out-alt"></i><span>退出登录</span></a>
                    </div>
                </div>
            </div>
        </nav>

        <!-- 侧边栏 -->
        <aside class="sidebar" id="sidebar">
            <div class="sidebar-header">
                <div class="sidebar-toggle" id="sidebar-toggle">
                    <i class="fas fa-bars"></i>
                </div>
            </div>
            <ul class="sidebar-menu">
                <li class="menu-item">
                    <a href="index.html" class="menu-link">
                        <i class="fas fa-home"></i>
                        <span class="menu-text">首页</span>
                    </a>
                </li>
                <li class="menu-item">
                    <a href="favorites.html" class="menu-link">
                        <i class="fas fa-bookmark"></i>
                        <span class="menu-text">收藏的书籍</span>
                        <span class="badge" data-type="favorites">0</span>
                    </a>
                </li>
                <li class="menu-item">
                    <a href="history.html" class="menu-link">
                        <i class="fas fa-history"></i>
                        <span class="menu-text">借阅历史</span>
                    </a>
                </li>
                <li class="menu-item">
                    <a href="borrowed.html" class="menu-link">
                        <i class="fas fa-book"></i>
                        <span class="menu-text">借阅及申请</span>
                        <span class="badge" data-type="borrowed">0</span>
                    </a>
                </li>
                <li class="menu-item">
                    <a href="activities.html" class="menu-link">
                        <i class="fas fa-calendar-alt"></i>
                        <span class="menu-text">活动</span>
                    </a>
                </li>
                <li class="menu-item">
                    <a href="recommend.html" class="menu-link">
                        <i class="fas fa-robot"></i>
                        <span class="menu-text">AI推荐</span>
                    </a>
                </li>
                <li class="menu-item">
                    <a href="stats.html" class="menu-link active">
                        <i class="fas fa-chart-bar"></i>
                        <span class="menu-text">阅读统计</span>
                    </a>
                </li>
            </ul>
        </aside>

        <!-- 主内容区域 -->
        <main class="main-content stats-main">
            <div class="stats-header">
                <h2>阅读统计概览</h2>
                <p>展示你的借书数量、阅读偏好及历史趋势</p>
            </div>

            <div class="stats-cards">
                <div class="stat-card">
                    <div class="stat-icon">
                        <i class="fas fa-book"></i>
                    </div>
                    <div class="stat-info">
                        <h3 id="total-books">0</h3>
                        <p>总借阅书籍</p>
                    </div>
                </div>
                <div class="stat-card">
                    <div class="stat-icon">
                        <i class="fas fa-clock"></i>
                    </div>
                    <div class="stat-info">
                        <h3 id="borrowed-this-month">0</h3>
                        <p>本月借阅量</p>
                    </div>
                </div>
                <div class="stat-card">
                    <div class="stat-icon">
                        <i class="fas fa-star"></i>
                    </div>
                    <div class="stat-info">
                        <h3 id="favorite-category">文学小说</h3>
                        <p>最爱书籍类型</p>
                    </div>
                </div>
            </div>

            <div class="charts-section">
                <div class="chart-card">
                    <h3>借书趋势（最近6个月）</h3>
                    <canvas id="borrowTrendChart"></canvas>
                </div>
                <div class="chart-card">
                    <h3>借阅偏好分类</h3>
                    <canvas id="categoryChart"></canvas>
                </div>
            </div>
        </main>
    </div>

    <script src="js/main.js"></script>
    <script src="js/stats.js"></script>
</body>

</html>
