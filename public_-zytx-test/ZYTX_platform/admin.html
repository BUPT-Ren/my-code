<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>管理后台 - 智阅同行</title>
    <link rel="stylesheet" href="https://cdn.bootcdn.net/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/admin.css">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>

<body>
    <div class="container">
        <nav class="top-nav">
            <div class="logo">
                <i class="fas fa-book-open"></i>
                <span>智阅同行 · 管理后台</span>
            </div>
            <div class="nav-right">
                <div class="user-profile" id="user-profile">
                    <div class="user-avatar" id="admin-avatar">AD</div>
                    <span id="admin-name">管理员</span>
                    <i class="fas fa-chevron-down"></i>
                    <div class="user-dropdown" id="user-dropdown">
                        <div class="user-info">
                            <div class="name" id="dropdown-name">管理员</div>
                            <div class="phone" id="dropdown-phone"></div>
                            <div class="admin-badge"><i class="fas fa-shield-alt"></i> 管理员</div>
                        </div>
                        <a href="index.html" class="dropdown-item">
                            <i class="fas fa-home"></i>
                            <span>返回用户端</span>
                        </a>
                        <a href="#" class="dropdown-item" onclick="logout()">
                            <i class="fas fa-sign-out-alt"></i>
                            <span>退出登录</span>
                        </a>
                    </div>
                </div>
            </div>
        </nav>

        <aside class="sidebar" id="sidebar">
            <div class="sidebar-header">
                <div class="sidebar-toggle" id="sidebar-toggle">
                    <i class="fas fa-bars"></i>
                </div>
            </div>
            <ul class="sidebar-menu">
                <li class="menu-item">
                    <a href="admin.html" class="menu-link active">
                        <i class="fas fa-tachometer-alt"></i>
                        <span class="menu-text">仪表盘</span>
                    </a>
                </li>
                <li class="menu-item">
                    <a href="admin-requests.html" class="menu-link">
                        <i class="fas fa-clipboard-list"></i>
                        <span class="menu-text">审核</span>
                        <span class="badge badge-warning" id="pending-count">0</span>
                    </a>
                </li>
                <li class="menu-item">
                    <a href="admin-books.html" class="menu-link">
                        <i class="fas fa-book"></i>
                        <span class="menu-text">图书管理</span>
                    </a>
                </li>
                <li class="menu-item">
                    <a href="admin-users.html" class="menu-link">
                        <i class="fas fa-users"></i>
                        <span class="menu-text">用户管理</span>
                    </a>
                </li>
                <li class="menu-item">
                    <a href="admin-activities.html" class="menu-link">
                        <i class="fas fa-calendar-alt"></i>
                        <span class="menu-text">活动管理</span>
                    </a>
                </li>
                <li class="menu-item">
                    <a href="admin-notifications.html" class="menu-link">
                        <i class="fas fa-bell"></i>
                        <span class="menu-text">通知管理</span>
                    </a>
                </li>
                <li class="menu-item">
                    <a href="admin-stats.html" class="menu-link">
                        <i class="fas fa-chart-bar"></i>
                        <span class="menu-text">数据统计</span>
                    </a>
                </li>
            </ul>
        </aside>

        <main class="main-content admin-main">
            <div class="page-header">
                <h1>仪表盘</h1>
                <p>欢迎使用智阅同行管理后台</p>
            </div>

            <div class="stats-grid">
                <div class="stat-card">
                    <div class="stat-icon blue">
                        <i class="fas fa-book"></i>
                    </div>
                    <div class="stat-content">
                        <h3 id="total-books">-</h3>
                        <p>总藏书量</p>
                    </div>
                    <div class="stat-trend up">
                        <i class="fas fa-arrow-up"></i>
                        <span id="books-trend">本月在册</span>
                    </div>
                </div>

                <div class="stat-card">
                    <div class="stat-icon green">
                        <i class="fas fa-users"></i>
                    </div>
                    <div class="stat-content">
                        <h3 id="total-users">-</h3>
                        <p>注册用户</p>
                    </div>
                    <div class="stat-trend up">
                        <i class="fas fa-arrow-up"></i>
                        <span id="users-trend">活跃用户</span>
                    </div>
                </div>

                <div class="stat-card">
                    <div class="stat-icon orange">
                        <i class="fas fa-book-reader"></i>
                    </div>
                    <div class="stat-content">
                        <h3 id="active-borrows">-</h3>
                        <p>正在借阅</p>
                    </div>
                    <div class="stat-trend">
                        <i class="fas fa-clock"></i>
                        <span id="borrows-trend">今日借出</span>
                    </div>
                </div>

                <div class="stat-card">
                    <div class="stat-icon red">
                        <i class="fas fa-hourglass-half"></i>
                    </div>
                    <div class="stat-content">
                        <h3 id="pending-requests">-</h3>
                        <p>待审核申请</p>
                    </div>
                    <div class="stat-trend urgent" id="pending-trend">
                        <i class="fas fa-exclamation-circle"></i>
                        <span>需要处理</span>
                    </div>
                </div>
            </div>

            <div class="charts-row">
                <div class="chart-card">
                    <div class="chart-header">
                        <h3><i class="fas fa-chart-line"></i> 近7日借阅趋势</h3>
                    </div>
                    <div class="chart-body">
                        <canvas id="borrowTrendChart"></canvas>
                    </div>
                </div>

                <div class="chart-card">
                    <div class="chart-header">
                        <h3><i class="fas fa-chart-pie"></i> 图书分类占比</h3>
                    </div>
                    <div class="chart-body">
                        <canvas id="categoryChart"></canvas>
                    </div>
                </div>
            </div>

            <div class="quick-actions">
                <div class="action-card pending-requests-card">
                    <div class="card-header">
                        <h3><i class="fas fa-clipboard-list"></i> 待审核申请</h3>
                        <a href="admin-requests.html" class="view-all">查看全部 <i class="fas fa-arrow-right"></i></a>
                    </div>
                    <div class="card-body">
                        <div id="pending-requests-list" class="requests-list">
                            <div class="loading-placeholder">
                                <i class="fas fa-spinner fa-spin"></i> 加载中...
                            </div>
                        </div>
                    </div>
                </div>

                <div class="action-card">
                    <div class="card-header">
                        <h3><i class="fas fa-bolt"></i> 快捷操作</h3>
                    </div>
                    <div class="card-body">
                        <div class="quick-buttons">
                            <a href="admin-books.html?action=add" class="quick-btn">
                                <i class="fas fa-plus"></i>
                                <span>新增图书</span>
                            </a>
                            <a href="admin-requests.html" class="quick-btn">
                                <i class="fas fa-check-circle"></i>
                                <span>审核申请</span>
                            </a>
                            <a href="admin-users.html" class="quick-btn">
                                <i class="fas fa-user-plus"></i>
                                <span>用户管理</span>
                            </a>
                            <a href="admin-stats.html" class="quick-btn">
                                <i class="fas fa-download"></i>
                                <span>导出报表</span>
                            </a>
                        </div>
                    </div>
                </div>
            </div>
        </main>
    </div>

    <script src="js/main.js"></script>
    <script src="js/admin.js"></script>
</body>

</html>
